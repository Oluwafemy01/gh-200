on: [push]
jobs:
  one:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Real Niggas shiii" > note.txt
      - run: cat note.txt
      - uses: actions/upload-artifact@v7
        with:
          path: note.txt
  two:
    needs: one
    runs-on: ubuntu-latest
    steps:
        - uses: actions/download-artifact@v8
          with:
            path: /
        - run: cat note.txt
